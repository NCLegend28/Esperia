# Local development only. Initialize with scripts/configure_search.py first.
name: esperia-search-dev
services:
  search:
    image: ${ESPERIA_SEARCH_IMAGE:?Set a reviewed image digest in the generated compose.env}
    pull_policy: never
    ports:
      - "127.0.0.1:${ESPERIA_SEARCH_PORT:-8082}:8080"
    volumes:
      - ./.local/dev/search/config:/etc/searxng
      - search-cache:/var/cache/searxng
    cpus: ${ESPERIA_SEARCH_CPUS:-1.0}
    mem_limit: ${ESPERIA_SEARCH_MEMORY_MB:-512}m
    pids_limit: 128
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5).read(1)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    restart: unless-stopped
volumes:
  search-cache:
