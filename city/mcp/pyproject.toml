[project]
name = "esperia-voxkit"
version = "0.1.0"
description = "MCP server that turns Esperia building specs (kit of parts) into MagicaVoxel .vox files and glTF for the city renderer"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2,<2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pillow>=10.0",
]

[project.scripts]
esperia-voxkit = "voxkit.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voxkit"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "black>=24"]

[tool.black]
line-length = 130
target-version = ["py311"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true
