[project]
name = "esperia"
version = "0.1.0"
description = "Persistent jobs and policy foundations for a personal agent city"
readme = "README.md"
authors = [
    { name = "Tali Mosley", email = "tali.mosley@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.13.0",
    "pydantic>=2.13.5",
    "pypdf>=6.18.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
esperia = "esperia:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.black]
target-version = ["py313"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
